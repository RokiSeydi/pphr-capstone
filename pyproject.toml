# Installed into the venv in editable mode by `make setup`, so `import
# capstone` works from a notebook in any directory - including mocks/attempts/,
# where you sit the mock papers.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pphr-capstone"
version = "0.1.0"
description = "Revision project for CHME0031, Programming with Python for Health Research"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["capstone", "drills", "solutions"]
